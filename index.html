<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Training Log</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="app-header">
    <div id="header-title">—</div>
    <button id="header-settings" aria-label="Settings">⚙</button>
  </header>

  <main id="app-main">
    <div id="loading">Loading…</div>
  </main>

  <nav id="app-tabs">
    <a href="#/today" data-view="today">Today</a>
    <a href="#/log" data-view="log">Log</a>
    <a href="#/graph" data-view="graph">Graph</a>
    <a href="#/adjust" data-view="adjust">Adjust</a>
    <a href="#/reviews" data-view="reviews">⋯</a>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("SW registration failed", e));
      });
    }
  </script>
</body>
</html>
